<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manga Colorizer</title>
<style>
  :root {
    --bg: #f7f8f8; --surface: #ffffff; --ink: #10201d; --ink-2: #5a6b66; --ink-3: #94a29d;
    --line: #e3e7e5; --accent: #2f6d5e; --accent-soft: #e5f0ec; --danger: #b4432f;
    --danger-soft: #f9e9e5; --radius: 14px;
    --mono: "Cascadia Mono", Consolas, monospace;
    --sans: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101614; --surface:#182220; --ink:#e6ebe9; --ink-2:#9fb0aa; --ink-3:#6c7a75;
            --line:#243230; --accent:#63b39d; --accent-soft:#1d2f2a; --danger:#e08a77; --danger-soft:#33211d; }
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); height: 100vh;
         display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { width: min(560px, 100%); background: var(--surface); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 36px 40px; }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .brand h1 { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
  .brand .ver { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .sub { color: var(--ink-2); font-size: 13px; margin-bottom: 26px; }
  .metric-row { display: flex; gap: 24px; margin-bottom: 20px; }
  .metric .k { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
  .metric .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .track { height: 8px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; margin: 6px 0 8px; }
  .fill { height: 100%; width: 0%; background: var(--accent); border-radius: 99px;
          transition: width .18s ease; }
  .fill.indeterminate { width: 35% !important; animation: slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0; } to { margin-left: 65%; } }
  .status { font-size: 13px; color: var(--ink-2); min-height: 38px; line-height: 1.5; }
  .status.err { color: var(--danger); }
  .file { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-top: 6px;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  button { font: inherit; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 9px 18px;
           border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { border-color: transparent; color: var(--ink-2); }
  .ledger { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 14px; }
  .ledger h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3);
               font-weight: 600; margin-bottom: 8px; display:flex; justify-content: space-between; }
  .ledger h2 button { padding: 2px 8px; font-size: 11px; }
  .ledger-list { max-height: 120px; overflow: auto; font-family: var(--mono); font-size: 10.5px;
                 color: var(--ink-2); display: grid; gap: 3px; }
  .ledger-list div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hidden { display: none; }
  .pill { display:inline-block; font-family: var(--mono); font-size:10px; padding:2px 8px; border-radius:99px;
          background: var(--accent-soft); color: var(--accent); }
  .pill.bad { background: var(--danger-soft); color: var(--danger); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><h1>Manga Colorizer</h1><span class="ver" id="ver">—</span></div>
    <div class="sub" id="subtitle">首次启动：需要下载上色模型权重（约 287 MB，一次性）</div>

    <div class="metric-row">
      <div class="metric"><div class="k">总体进度</div><div class="v" id="pct">0%</div></div>
      <div class="metric"><div class="k">已完成</div><div class="v" id="bytes">0 / 0 MB</div></div>
      <div class="metric"><div class="k">断点续传</div><div class="v" id="resume">—</div></div>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="status" id="status">正在准备…</div>
    <div class="file" id="curfile"></div>

    <div class="actions">
      <button class="primary" id="btn-start">开始下载</button>
      <button id="btn-retry" class="hidden">重试</button>
      <button id="btn-dir" class="ghost">打开权重目录</button>
      <button id="btn-del" class="ghost hidden">删除已下载权重</button>
    </div>

    <div class="ledger hidden" id="ledger-box">
      <h2>下载台账 <button id="btn-ledger">刷新</button></h2>
      <div class="ledger-list" id="ledger"></div>
    </div>
  </div>

<script>
(function () {
  var invoke = window.__TAURI__.core.invoke, listen = window.__TAURI__.event.listen;
  var $ = function (id) { return document.getElementById(id); };
  var fmtMB = function (n) { return (n / 1048576).toFixed(1); };

  function setProgress(p) {
    var pct = p.totalBytes ? Math.round(100 * p.totalBytesDone / p.totalBytes) : 0;
    $('pct').textContent = pct + '%';
    $('bytes').textContent = fmtMB(p.totalBytesDone) + ' / ' + fmtMB(p.totalBytes) + ' MB';
    var fill = $('fill');
    fill.classList.toggle('indeterminate', p.phase === 'verifying');
    fill.style.width = (p.phase === 'verifying' ? 100 : pct) + '%';
    if (p.resumedFrom > 0) { $('resume').textContent = '+' + fmtMB(p.resumedFrom) + 'MB'; $('resume').classList.add('pill'); }
    if (p.currentFile) $('curfile').textContent = p.currentFile;
    var st = $('status');
    st.classList.remove('err');
    if (p.phase === 'downloading') st.textContent = '正在下载权重…' + (p.message ? '' : '');
    else if (p.phase === 'verifying') st.textContent = '下载完成，正在校验 sha256…';
    else if (p.phase === 'done') { st.textContent = '权重就绪，正在启动上色服务…'; refreshLedger(); }
    else if (p.phase === 'failed') { st.textContent = p.message || '下载失败'; st.classList.add('err'); showRetry(); }
    else if (p.phase === 'idle') st.textContent = '就绪。点击「开始下载」获取模型权重。';
  }
  function showRetry() {
    $('btn-retry').classList.remove('hidden');
    $('btn-del').classList.remove('hidden');
    $('btn-start').disabled = false;
  }
  function refreshLedger() {
    invoke('cmd_ledger').then(function (rows) {
      if (!rows.length) return;
      $('ledger-box').classList.remove('hidden');
      $('ledger').innerHTML = rows.slice(-40).map(function (r) {
        return '<div>' + new Date(r.time).toLocaleTimeString() + ' · ' + r.event + ' · ' + (r.file || '') +
               (r.size ? ' · ' + fmtMB(r.size) + 'MB' : '') +
               (r.resumedFrom ? ' · 续传' + fmtMB(r.resumedFrom) + 'MB' : '') +
               (r.reason ? ' · ' + r.reason : '') + '</div>';
      }).join('');
    }).catch(function(){});
  }

  $('btn-start').addEventListener('click', function () {
    $('btn-start').disabled = true; $('btn-retry').classList.add('hidden'); $('btn-del').classList.add('hidden');
    invoke('cmd_start_download').catch(function (e) { $('status').textContent = String(e); $('status').classList.add('err'); showRetry(); });
  });
  $('btn-retry').addEventListener('click', function () { $('btn-start').click(); });
  $('btn-dir').addEventListener('click', function () { invoke('cmd_open_weights_dir').catch(function(){}); });
  $('btn-del').addEventListener('click', function () {
    if (!confirm('确定删除已下载的权重文件？删除后可重新完整下载。')) return;
    invoke('cmd_delete_weights').then(function (freed) {
      $('status').textContent = '已删除，释放 ' + fmtMB(freed) + ' MB。可重新下载。';
      $('fill').style.width = '0%'; $('pct').textContent = '0%'; $('bytes').textContent = '0 / 0 MB';
      $('resume').textContent = '—'; $('resume').classList.remove('pill'); refreshLedger();
    }).catch(function (e) { $('status').textContent = String(e); $('status').classList.add('err'); });
  });
  $('btn-ledger').addEventListener('click', refreshLedger);

  listen('download-progress', function (ev) { setProgress(ev.payload); });
  listen('sidecar-status', function (ev) {
    if (ev.payload.state === 'ready') {
      $('subtitle').textContent = '服务已就绪，正在进入工作台…';
      $('status').textContent = '界面即将加载。';
    } else if (ev.payload.state === 'starting') {
      $('status').textContent = '正在启动上色服务…';
    } else if (ev.payload.message) {
      $('status').textContent = ev.payload.message; $('status').classList.add('err');
    }
  });
  listen('boot-stage', function (ev) {
    if (ev.payload === 'need-weights') {
      invoke('cmd_weights_status').then(function (st) {
        $('ver').textContent = 'weights ' + st.manifestVersion;
        $('bytes').textContent = fmtMB(st.doneBytes) + ' / ' + fmtMB(st.totalBytes) + ' MB';
        var pct = st.totalBytes ? Math.round(100 * st.doneBytes / st.totalBytes) : 0;
        $('pct').textContent = pct + '%'; $('fill').style.width = pct + '%';
        if (st.doneBytes > 0) {
          $('status').textContent = '检测到未完成的下载，可从断点继续。';
          $('resume').textContent = '+' + fmtMB(st.doneBytes) + 'MB'; $('resume').classList.add('pill');
        } else { $('status').textContent = '就绪。点击「开始下载」获取模型权重。'; }
        refreshLedger();
      }).catch(function(){});
    } else if (ev.payload === 'starting-service') {
      $('subtitle').textContent = '模型权重已就绪';
      $('status').textContent = '正在启动上色服务…';
      $('fill').style.width = '100%'; $('pct').textContent = '100%';
      $('btn-start').disabled = true;
    }
  });

  invoke('cmd_weights_status').then(function (st) {
    if (!$('ver').textContent || $('ver').textContent === '—') $('ver').textContent = 'weights ' + st.manifestVersion;
  }).catch(function(){});
})();
</script>
</body>
</html>
