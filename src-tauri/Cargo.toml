[package]
name = "manga-colorizer"
version = "0.3.3"
description = "Manga Colorizer desktop shell (Tauri 2) - web workbench + Python sidecar + weight downloader"
authors = ["manga-colorizer"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "manga_colorizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "manga-colorizer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "json", "native-tls"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5"
sysinfo = "0.32"

[target.'x86_64-pc-windows-msvc'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"






