<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>manga-colorizer API 演示</title>
<style>
  :root { --ink: #1a1a1a; --paper: #fafaf7; --accent: #0f6b5c; --line: #e2e2dc; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--paper); color: var(--ink); }
  header { padding: 28px 32px 20px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; letter-spacing: .02em; }
  header p { margin: 0; font-size: 13px; color: #6b6b66; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 32px 48px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .card h2 { margin: 0 0 10px; font-size: 14px; font-weight: 600; color: #444; }
  .drop { border: 1.5px dashed #c9c9c2; border-radius: 8px; padding: 18px; text-align: center; font-size: 13px; color: #777; cursor: pointer; }
  .drop.hover { border-color: var(--accent); background: #f2faf8; }
  canvas { max-width: 100%; display: block; margin: 10px auto 0; image-rendering: pixelated; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
  button:disabled { background: #b5d6d0; cursor: wait; }
  button.ghost { background: #eee; color: #444; }
  select, input[type=range] { font-size: 13px; }
  .hint-note { font-size: 12px; color: #8a8a84; margin-top: 8px; line-height: 1.6; }
  #log { margin-top: 16px; font-family: Consolas, monospace; font-size: 12px; background: #141414; color: #9fe3d2; border-radius: 8px; padding: 12px 14px; min-height: 60px; white-space: pre-wrap; }
  .badge { display: inline-block; background: #eef6f4; color: var(--accent); border-radius: 99px; padding: 2px 10px; font-size: 12px; margin-right: 6px; }
</style>
</head>
<body>
<header>
  <h1>manga-colorizer 后端 API 演示</h1>
  <p>验证页(非产品前端): 上传黑白漫画 → 点击图中位置放置提示色 → 调用 POST /api/colorize 查看结果。</p>
</header>
<main>
  <div class="grid">
    <div class="card">
      <h2>① 原图与提示点</h2>
      <div id="drop" class="drop">点击选择 或 拖入黑白漫画图片 (PNG/JPG)</div>
      <canvas id="srcCanvas" width="0" height="0"></canvas>
      <div class="row">
        <span class="badge">提示色</span>
        <input type="color" id="hintColor" value="#d94f4f">
        <button class="ghost" id="clearHints">清空提示点</button>
        <span id="hintCount" style="font-size:12px;color:#888">0 个提示点</span>
      </div>
      <p class="hint-note">在左侧画布上单击即可放置提示点: 颜色会沿亮度相近的区域扩散。头发、衣服、背景各点 1-3 个效果最好。纯黑线稿与纸白默认锁定不上色。</p>
    </div>
    <div class="card">
      <h2>② 上色结果</h2>
      <div class="row" style="margin:0 0 10px">
        <button id="runColorize">运行上色 /api/colorize</button>
        <button id="runTint">整图色调 /api/tint</button>
        <select id="preset">
          <option value="sepia">sepia (怀旧棕)</option>
          <option value="warm-dawn">warm-dawn (暖晨)</option>
          <option value="moonlit">moonlit (月光)</option>
        </select>
      </div>
      <canvas id="outCanvas" width="0" height="0"></canvas>
      <div id="meta" class="hint-note"></div>
    </div>
  </div>
  <div id="log">就绪。</div>
</main>
<script>
const drop = document.getElementById('drop');
const srcCanvas = document.getElementById('srcCanvas');
const outCanvas = document.getElementById('outCanvas');
const hints = [];
let image = null;

function log(msg) { const el = document.getElementById('log'); el.textContent += '\n' + msg; el.scrollTop = el.scrollHeight; }

drop.addEventListener('click', () => { const i = document.createElement('input'); i.type='file'; i.accept='image/*'; i.onchange=() => i.files[0] && loadFile(i.files[0]); i.click(); });
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('hover'); });
drop.addEventListener('dragleave', () => drop.classList.remove('hover'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('hover'); e.dataTransfer.files[0] && loadFile(e.dataTransfer.files[0]); });

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    image = new Image();
    image.onload = () => {
      const maxW = 460;
      const scale = Math.min(1, maxW / image.width);
      srcCanvas.width = image.width; srcCanvas.height = image.height;
      srcCanvas.style.width = (image.width * scale) + 'px';
      outCanvas.width = image.width; outCanvas.height = image.height;
      outCanvas.style.width = (image.width * scale) + 'px';
      const ctx = srcCanvas.getContext('2d');
      ctx.drawImage(image, 0, 0);
      hints.length = 0; updateHintCount();
      log('已加载: ' + file.name + ' (' + image.width + 'x' + image.height + ')');
    };
    image.src = reader.result;
  };
  reader.readAsDataURL(file);
}

srcCanvas.addEventListener('click', e => {
  if (!image) { log('请先加载图片'); return; }
  const rect = srcCanvas.getBoundingClientRect();
  const x = Math.round((e.clientX - rect.left) * srcCanvas.width / rect.width);
  const y = Math.round((e.clientY - rect.top) * srcCanvas.height / rect.height);
  const color = document.getElementById('hintColor').value;
  const r = parseInt(color.slice(1,3),16), g = parseInt(color.slice(3,5),16), b = parseInt(color.slice(5,7),16);
  hints.push({x, y, r, g, b});
  const ctx = srcCanvas.getContext('2d');
  ctx.beginPath(); ctx.arc(x, y, Math.max(3, srcCanvas.width/180), 0, Math.PI*2);
  ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  updateHintCount();
});
function updateHintCount() { document.getElementById('hintCount').textContent = hints.length + ' 个提示点'; }
document.getElementById('clearHints').addEventListener('click', () => {
  hints.length = 0; updateHintCount();
  if (image) { const ctx = srcCanvas.getContext('2d'); ctx.clearRect(0,0,srcCanvas.width,srcCanvas.height); ctx.drawImage(image,0,0); }
});

async function postForm(path, fields, file) {
  const form = new FormData();
  form.append('image', file, 'input.png');
  for (const [k,v] of Object.entries(fields)) form.append(k, v);
  const resp = await fetch(path, { method: 'POST', body: form });
  if (!resp.ok) {
    let msg = resp.status + ' ' + resp.statusText;
    try { msg = (await resp.json()).error || msg; } catch (_) {}
    throw new Error(msg);
  }
  return resp;
}

document.getElementById('runColorize').addEventListener('click', async () => {
  if (!image) { log('请先加载图片'); return; }
  if (!hints.length) { log('请先在原图上点击放置至少 1 个提示点'); return; }
  const btn = document.getElementById('runColorize'); btn.disabled = true;
  log('POST /api/colorize (hints=' + hints.length + ') …');
  try {
    const blob = await new Promise(res => srcCanvas.toBlob(res, 'image/png'));
    const resp = await postForm('/api/colorize', { hints: JSON.stringify(hints), options: JSON.stringify({}) }, blob);
    drawResult(await resp.blob());
    const it = resp.headers.get('x-colorize-iterations'), hd = resp.headers.get('x-colorize-hints'), lk = resp.headers.get('x-colorize-locked-monochrome');
    document.getElementById('meta').textContent = '迭代 ' + it + ' 次 · 提示点 ' + hd + ' · 锁定黑白像素 ' + lk;
    log('上色完成。');
  } catch (err) { log('失败: ' + err.message); }
  btn.disabled = false;
});

document.getElementById('runTint').addEventListener('click', async () => {
  if (!image) { log('请先加载图片'); return; }
  const btn = document.getElementById('runTint'); btn.disabled = true;
  const preset = document.getElementById('preset').value;
  log('POST /api/tint (preset=' + preset + ') …');
  try {
    const blob = await new Promise(res => srcCanvas.toBlob(res, 'image/png'));
    const resp = await postForm('/api/tint', { preset, options: JSON.stringify({}) }, blob);
    drawResult(await resp.blob());
    document.getElementById('meta').textContent = '渐变映射预设: ' + preset;
    log('色调映射完成。');
  } catch (err) { log('失败: ' + err.message); }
  btn.disabled = false;
});

function drawResult(blob) {
  const url = URL.createObjectURL(blob);
  const im = new Image();
  im.onload = () => { const ctx = outCanvas.getContext('2d'); ctx.drawImage(im, 0, 0); URL.revokeObjectURL(url); };
  im.src = url;
}
</script>
</body>
</html>
