name: Release

# 发布流程：打 v* 标签 = 发新版，平时不触发任何构建。
#
# 发版步骤（本地）：
#   1. 统一三处版本号：src-tauri/tauri.conf.json 的 version、
#      mobile/pubspec.yaml 的 version、本次要打的标签号（去掉 v 前缀）
#   2. 提交代码
#   3. 打标签并推送：git tag v0.4.1 && git push origin v0.4.1
#   → 自动构建 Windows 安装包 + 安卓分架构 APK，并创建 GitHub Release 上传全部产物
#
# 注意：工作流按「标签所在提交」里的这份文件执行，调整流程后要先提交再打标签。
# 手动触发（workflow_dispatch）只构建不发布，用于免标签试跑流水线。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# 同一 ref 重复触发时排队串行，避免并行构建互相踩
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: 版本一致性检查（标签 = 桌面版 = 安卓版）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify versions match tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          TAG_VER="${GITHUB_REF_NAME#v}"
          TAURI_VER=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -n1)
          MOBILE_VER=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' mobile/pubspec.yaml | head -n1)
          echo "标签=$TAG_VER 桌面端=$TAURI_VER 安卓端=$MOBILE_VER"
          if [ -z "$TAG_VER" ] || [ -z "$TAURI_VER" ] || [ -z "$MOBILE_VER" ]; then
            echo "::error::版本号解析失败，请检查 src-tauri/tauri.conf.json 与 mobile/pubspec.yaml 的 version 字段"
            exit 1
          fi
          if [ "$TAG_VER" != "$TAURI_VER" ] || [ "$TAG_VER" != "$MOBILE_VER" ]; then
            echo "::error::版本不一致：标签 v$TAG_VER，桌面端 $TAURI_VER，安卓端 $MOBILE_VER。请先统一三处版本号并提交，再打标签。"
            exit 1
          fi
          echo "版本一致（$TAG_VER）"

  desktop:
    name: Windows desktop (Tauri NSIS) + sidecar
    needs: [validate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r tool/colorizer_service/requirements.txt pyinstaller

      - name: Build sidecar (PyInstaller onefile)
        run: |
          python -m PyInstaller sidecar/manga-colorizer-sidecar.spec --noconfirm --distpath build/sidecar-dist --workpath build/sidecar-work
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item build/sidecar-dist/manga-colorizer-sidecar.exe src-tauri/binaries/manga-colorizer-sidecar-x86_64-pc-windows-msvc.exe -Force
          Get-Item src-tauri/binaries/*.exe | Select-Object Name,Length

      - name: Setup Rust (rsproxy)
        shell: bash
        run: |
          rustup default stable
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<'EOF'
          [source.crates-io]
          replace-with = "rsproxy-sparse"
          [source.rsproxy-sparse]
          registry = "sparse+https://rsproxy.cn/index/"
          [registries.rsproxy]
          index = "sparse+https://rsproxy.cn/index/"
          EOF

      - name: Install Tauri CLI (npm)
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri app (NSIS installer)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: .
          tauriScript: tauri
          args: --config src-tauri/tauri.conf.json

      - name: Upload installer + sidecar
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            build/sidecar-dist/manga-colorizer-sidecar.exe

  android:
    name: Android APKs (Flutter, release-signed, per-ABI)
    needs: [validate]
    runs-on: ubuntu-latest
    # secrets 上下文不能用于 step 级 if，先在 job 级 env 落地，再用 env.KEYSTORE_B64 判断
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PW: ${{ secrets.ANDROID_STORE_PASSWORD }}
      KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub get
        working-directory: mobile
        run: flutter pub get

      - name: Configure release signing
        if: ${{ env.KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # 用 printf 而非 echo，避免 base64 中特殊字符被解释
          printf '%s' "$KEYSTORE_B64" | base64 -d > mobile/android/upload-keystore.jks
          KS=mobile/android/upload-keystore.jks
          if [ ! -s "$KS" ]; then
            echo "::error::解码后的 keystore 为空，ANDROID_KEYSTORE_BASE64 secret 无效（可能为空或不是正确的 base64）"
            exit 1
          fi
          # 魔数校验：PKCS12 以 30 82 开头，JKS 以 fe ed fe ed 开头
          MAGIC=$(head -c 2 "$KS" | od -An -tx1 | tr -d ' \n')
          if [ "$MAGIC" != "3082" ] && [ "$MAGIC" != "feed" ]; then
            echo "::error::解码后的 keystore 格式无法识别（magic=$MAGIC）。请用 .jks/.p12 文件重新导出 ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          {
            echo "storePassword=$STORE_PW"
            echo "keyPassword=$KEY_PW"
            echo "keyAlias=$ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > mobile/android/key.properties
          echo "签名配置已写入（alias=$ALIAS）。"
          # 签名自检：用给定 store/key 密码立即验证能读出该别名，
          # 避免跑完 4 分钟 gradle 才在 packageRelease 报 "Failed to read key ... : null"
          KT="$JAVA_HOME/bin/keytool"
          if [ ! -x "$KT" ]; then KT=keytool; fi
          if ! "$KT" -list -alias "$ALIAS" -keystore "$KS" -storepass "$STORE_PW" -keypass "$KEY_PW" >/dev/null 2>&1; then
            echo "::error::签名自检失败：用 ANDROID_STORE_PASSWORD / ANDROID_KEY_PASSWORD 读不出别名 '$ALIAS'。请确认 4 个 secret 来自同一份 keystore（base64、store 密码、key 密码、alias 必须一致）。"
            exit 1
          fi
          echo "签名自检通过（alias=$ALIAS 可读）。"

      # 按 CPU 架构分包：产出 arm64-v8a / armeabi-v7a / x86_64 三个单架构小包
      - name: Build APKs (release, split per ABI)
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/app-*-release.apk

  publish:
    name: Publish GitHub Release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 关键修复：download-artifact 会保留目录层级，旧写法 files: artifacts/*
      # 只匹配到文件夹、被发布动作按文件过滤后变成 0 个附件。
      # 先把所有文件摊平到 release/ 并统一命名，再上传。
      - name: Collect and rename assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          TAG="${GITHUB_REF_NAME}"
          # Windows 安装包（NSIS 文件名带空格和版本号，统一成规范名）
          for f in *_x64-setup.exe; do mv "$f" "MangaColorizer-${TAG}-win64-setup.exe"; done
          # sidecar 独立版（安装包内已内置同款，供绿色安装/排查用）
          if [ -f manga-colorizer-sidecar.exe ]; then
            mv manga-colorizer-sidecar.exe "manga-colorizer-sidecar-${TAG}-win64.exe"
          fi
          # 安卓分架构 APK
          mv app-arm64-v8a-release.apk   "MangaColorizer-${TAG}-android-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "MangaColorizer-${TAG}-android-armeabi-v7a.apk"
          mv app-x86_64-release.apk      "MangaColorizer-${TAG}-android-x86_64.apk"
          echo "== 待上传产物 =="
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            **Windows**：下载 `MangaColorizer-${{ github.ref_name }}-win64-setup.exe` 双击安装。
            **Android**：按手机 CPU 架构下载对应 APK，绝大多数手机选 `arm64-v8a`。
