name: CI & Release

# 单一工作流承担 CI 与发布，避免两份重复的构建逻辑：
# - push main / PR / 手动触发：仅构建验证（不发布）
# - 推送 v* tag：构建 + 自动创建 GitHub Release 并上传产物
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 修复「推 main + 推 v* tag」时同一提交触发两次并行构建的问题：
# 用 workflow 名 + commit SHA 作为并发组，后到的运行会排队等待而非同时跑。
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Windows desktop (Tauri NSIS) + sidecar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r tool/colorizer_service/requirements.txt pyinstaller

      - name: Build sidecar (PyInstaller onefile)
        run: |
          python -m PyInstaller sidecar/manga-colorizer-sidecar.spec --noconfirm --distpath build/sidecar-dist --workpath build/sidecar-work
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item build/sidecar-dist/manga-colorizer-sidecar.exe src-tauri/binaries/manga-colorizer-sidecar-x86_64-pc-windows-msvc.exe -Force
          Get-Item src-tauri/binaries/*.exe | Select-Object Name,Length

      - name: Setup Rust (rsproxy)
        shell: bash
        run: |
          rustup default stable
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<'EOF'
          [source.crates-io]
          replace-with = "rsproxy-sparse"
          [source.rsproxy-sparse]
          registry = "sparse+https://rsproxy.cn/index/"
          [registries.rsproxy]
          index = "sparse+https://rsproxy.cn/index/"
          EOF

      - name: Install Tauri CLI (npm)
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri app (NSIS installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: tauri
          args: --config src-tauri/tauri.conf.json

      - name: Upload installer + sidecar
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            build/sidecar-dist/manga-colorizer-sidecar.exe

  android:
    name: Android APK (Flutter, release-signed)
    runs-on: ubuntu-latest
    # secrets 上下文不能用于 step 级 if，先在 job 级 env 落地，再用 env.KEYSTORE_B64 判断
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PW: ${{ secrets.ANDROID_STORE_PASSWORD }}
      KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub get
        working-directory: mobile
        run: flutter pub get

      - name: Configure release signing
        if: ${{ env.KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # 用 printf 而非 echo，避免 base64 中特殊字符被解释
          printf '%s' "$KEYSTORE_B64" | base64 -d > mobile/android/upload-keystore.jks
          KS=mobile/android/upload-keystore.jks
          if [ ! -s "$KS" ]; then
            echo "::error::解码后的 keystore 为空，ANDROID_KEYSTORE_BASE64 secret 无效（可能为空或不是正确的 base64）"
            exit 1
          fi
          # 魔数校验：PKCS12 以 30 82 开头，JKS 以 fe ed fe ed 开头
          MAGIC=$(head -c 2 "$KS" | od -An -tx1 | tr -d ' \n')
          if [ "$MAGIC" != "3082" ] && [ "$MAGIC" != "feed" ]; then
            echo "::error::解码后的 keystore 格式无法识别（magic=$MAGIC）。请用 .jks/.p12 文件重新导出 ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          {
            echo "storePassword=$STORE_PW"
            echo "keyPassword=$KEY_PW"
            echo "keyAlias=$ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > mobile/android/key.properties
          echo "签名配置已写入（alias=$ALIAS）。"
          # 签名自检：用给定 store/key 密码立即验证能读出该别名，
          # 避免跑完 4 分钟 gradle 才在 packageRelease 报 "Failed to read key ... : null"
          KT="$JAVA_HOME/bin/keytool"
          if [ ! -x "$KT" ]; then KT=keytool; fi
          if ! "$KT" -list -alias "$ALIAS" -keystore "$KS" -storepass "$STORE_PW" -keypass "$KEY_PW" >/dev/null 2>&1; then
            echo "::error::签名自检失败：用 ANDROID_STORE_PASSWORD / ANDROID_KEY_PASSWORD 读不出别名 '$ALIAS'。请确认 4 个 secret 来自同一份 keystore（base64、store 密码、key 密码、alias 必须一致）。"
            exit 1
          fi
          echo "签名自检通过（alias=$ALIAS 可读）。"

      - name: Build APK (release)
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  publish:
    name: Publish GitHub Release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
