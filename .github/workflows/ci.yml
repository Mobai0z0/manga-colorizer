name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  desktop:
    name: Windows desktop (Tauri NSIS) + sidecar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r tool/colorizer_service/requirements.txt pyinstaller

      - name: Build sidecar (PyInstaller onefile)
        run: |
          python -m PyInstaller sidecar/manga-colorizer-sidecar.spec --noconfirm --distpath build/sidecar-dist --workpath build/sidecar-work
          Copy-Item build/sidecar-dist/manga-colorizer-sidecar.exe src-tauri/binaries/manga-colorizer-sidecar-x86_64-pc-windows-msvc.exe -Force
          Get-Item src-tauri/binaries/*.exe | Select-Object Name,Length

      - name: Setup Rust (rsproxy)
        shell: bash
        run: |
          rustup default stable
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<'EOF'
          [source.crates-io]
          replace-with = "rsproxy-sparse"
          [source.rsproxy-sparse]
          registry = "sparse+https://rsproxy.cn/index/"
          [registries.rsproxy]
          index = "sparse+https://rsproxy.cn/index/"
          EOF

      - name: Install Tauri CLI (npm)
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri app (NSIS installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: tauri
          args: --config src-tauri/tauri.conf.json

      - name: Smoke test sidecar exe
        run: |
          $p = Start-Process -FilePath build/sidecar-dist/manga-colorizer-sidecar.exe -ArgumentList '--port','18793' -PassThru -WindowStyle Hidden
          $ok=$false
          foreach ($i in 1..40) { Start-Sleep -Milliseconds 1500; try { $r = Invoke-RestMethod "http://127.0.0.1:18793/health" -TimeoutSec 2; $ok=$true; break } catch {} }
          if (-not $ok) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'sidecar health check failed' }
          $r | ConvertTo-Json -Compress
          $idx = Invoke-WebRequest "http://127.0.0.1:18793/" -TimeoutSec 3 -UseBasicParsing
          if ($idx.RawContentLength -lt 1000) { throw 'web dist not served' }
          Write-Host "index bytes: $($idx.RawContentLength)"
          Stop-Process -Id $p.Id -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload sidecar exe
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-exe
          path: build/sidecar-dist/manga-colorizer-sidecar.exe

  android:
    name: Android APK (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build APK (release)
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk




