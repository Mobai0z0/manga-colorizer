name: manga_colorizer_mobile
description: Manga Colorizer Android app - embeds manga_colorizer_core (pure-Dart hint-based colorization).
publish_to: none
resolution: workspace
version: 0.5.25+31

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  # Material You「跟随设备取色」：Flutter 3.47 移除了 MaterialApp.dynamicColorBuilder，
  # 改由该包的 DynamicColorBuilder widget 提供设备调色板（不支持时回退固定种子）。
  dynamic_color: ^1.7.0
  # 本仓的绑定调用（createSession/OrtSession.close/OrtValue.asFlattenedList）
  # 与 flutter_onnxruntime 的 Android 16KB 页要求均在 1.8.5 源码上逐个核对过，
  # 故下界取实际验证版本，避免解析出未核对过的旧绑定。
  flutter_onnxruntime: ^1.8.5
  # resize/blur 用纯 Dart 的 image 包（average≈cv2 INTER_AREA，
  # cubic≈cv2 INTER_CUBIC）。workspace lock 已含 4.10.1（传递依赖），
  # 提为直接依赖不改变解析版本。
  image: ^4.3.0
  image_picker: ^1.1.2
  # ort_ffi.dart 直调 libonnxruntime.so C API 所需（malloc/Utf8 助手）。
  # 2.2.0 已是传递依赖，提为直接依赖不改变解析版本。
  ffi: ^2.2.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  manga_colorizer_core:
    path: ../packages/manga_colorizer_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample_bw.png

